name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Graphviz (для SVG-тесту)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y graphviz
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=sipl --cov-fail-under=80
      - run: sipl eval examples/ok/prime.sipl --set N=3
